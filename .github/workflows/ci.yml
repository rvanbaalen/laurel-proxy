name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # Runs before the build so a type error is reported as one, rather than as
      # whichever build step happens to trip over it first. This is also the only
      # thing that checks src/ui/** on its own terms: vite build strips types
      # without checking them, and the base project excludes the UI entirely.
      - run: npm run typecheck

      - run: npm run build

      - run: npm test
